<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redstar Pathfinder 2e Chronicles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Redstar Pathfinder',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      plugins: [
        function(hook, vm) {
          // Pre-parse markdown (Wikilinks and Image embeds)
          hook.beforeEach(function(content) {
            // Parse Image Embeds: ![[image.png]]
            content = content.replace(/!\[\[([^|\]]+)(?:\|([^\]]+))?\]\]/g, function(match, file, alt) {
              return '![' + (alt || file).trim() + '](' + file.trim() + ')';
            });

            // Parse Wikilinks: [[Target Page|Display Text]] or [[Target Page]]
            content = content.replace(/\[\[([^|\]]+)(?:\|([^\]]+))?\]\]/g, function(match, target, label) {
              var text = (label || target).trim();
              var link = target.trim();

              if (link.includes('#') && !link.includes('.md#')) {
                link = link.replace('#', '.md#');
              } else if (!link.includes('.md') && !link.includes('#')) {
                link += '.md';
              }

              return '[' + text + '](' + link + ')';
            });

            return content;
          });

          // Post-parse rendered HTML (GitHub Alerts parser)
          hook.afterEach(function(html) {
            var alertIcons = {
              note: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>',
              tip: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 1.5c-2.363 0-4 1.69-4 3.75 0 .984.424 1.625.984 2.304l.214.253c.223.264.47.556.673.848.284.411.537.896.621 1.49a.75.75 0 0 1-1.484.211c-.04-.282-.163-.547-.37-.847a8.456 8.456 0 0 0-.542-.68c-.08-.094-.16-.185-.24-.28C3.12 7.733 2.5 6.74 2.5 5.25 2.5 2.31 4.77 0 8 0s5.5 2.31 5.5 5.25c0 1.49-.62 2.483-1.356 3.284-.08.095-.16.186-.24.28-.19.224-.37.44-.542.68-.207.3-.33.565-.37.847a.75.75 0 0 1-1.485-.212c.084-.593.337-1.078.621-1.489.203-.292.45-.584.673-.848.075-.088.147-.173.213-.253.561-.679.985-1.32.985-2.304 0-2.06-1.637-3.75-4-3.75ZM5.75 12h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1 0-1.5Zm1 3h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1 0-1.5Z"/></svg>',
              important: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H8.06l-2.573 2.573A1.458 1.458 0 0 1 3 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .25.25.25.25.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.75.75 0 0 1 .53-.22h6.5a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25Zm7 2.25v4a.75.75 0 0 1-1.5 0v-4a.75.75 0 0 1 1.5 0ZM8 10.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>',
              warning: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/></svg>',
              caution: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M4.47.04c.17-.04.34-.04.51-.04h6.04c.17 0 .34 0 .51.04.17.04.33.1.48.19.15.09.28.2.39.34l4.27 4.27c.14.11.25.24.34.39.09.15.15.31.19.48.04.17.04.34.04.51v6.04c0 .17 0 .34-.04.51-.04.17-.1.33-.19.48-.09.15-.2.28-.34.39l-4.27 4.27c-.11.14-.24.25-.39.34-.15.09-.31.15-.48.19-.17.04-.34.04-.51.04H5.02c-.17 0-.34 0-.51-.04a2.023 2.023 0 0 1-.87-.53L.37 12.3c-.14-.11-.25-.24-.34-.39a2.023 2.023 0 0 1-.23-.99V4.88c0-.17 0-.34.04-.51.04-.17.1-.33.19-.48.09-.15.2-.28.34-.39L4.08.57c.11-.14.24-.25.39-.34.15-.09.31-.15.48-.19ZM5.32 1.5 1.5 5.32v5.36L5.32 14.5h5.36l3.82-3.82V5.32L10.68 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>'
            };

            return html.replace(/<blockquote>([\s\S]*?)<\/blockquote>/gi, function(match, content) {
              var tagMatch = content.match(/^\s*<p>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\s*<br\s*\/?>)?\s*([\s\S]*?)<\/p>/i);
              if (!tagMatch) return match;

              var type = tagMatch[1].toLowerCase();
              var bodyFirstLine = tagMatch[2].trim();
              var restOfContent = content.replace(/^\s*<p>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\s*<br\s*\/?>)?[\s\S]*?<\/p>/i, '');
              var iconSvg = alertIcons[type] || '';

              return '<div class="gh-alert gh-alert-' + type + '">' +
                     '<div class="gh-alert-title" style="display:flex;align-items:center;gap:8px;">' +
                     iconSvg + '<span>' + type + '</span></div>' +
                     (bodyFirstLine ? '<p>' + bodyFirstLine + '</p>' : '') +
                     restOfContent +
                     '</div>';
            });
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
</html>
